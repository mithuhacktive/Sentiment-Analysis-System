[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiguard"
version = "1.0.0"
description = "Real-time evidence-grounded product sentiment intelligence backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "sqlalchemy==2.0.30",
    "aiosqlite==0.20.0",
    "httpx==0.27.0",
    "aiohttp==3.9.5",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.1",
    "transformers==4.41.1",
    "torch==2.3.0",
    "scipy==1.13.0",
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
    "langdetect==1.0.9",
    "xxhash==3.4.1",
    "datasketch==1.6.4",
    "cachetools==5.3.3",
    "python-ulid==2.2.0",
    "tenacity==8.3.0",
    "tqdm==4.66.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-mock==3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]